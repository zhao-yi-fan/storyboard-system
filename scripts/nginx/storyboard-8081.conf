server {
    listen 8081;
    server_name _ popreels.zhaoyifan.top;
    client_max_body_size 20m;
    root /home/admin/projects/storyboard-system/storyboard-app/dist;
    index index.html;
    location = /assets { try_files /index.html =404; }
    location = /assets/ { try_files /index.html =404; }

    location ^~ /generated/ { return 404; }
    location ^~ /_media/stream/ { return 404; }

    location /api { proxy_pass http://127.0.0.1:8083; }
    location / { try_files $uri $uri/ /index.html; }
}
